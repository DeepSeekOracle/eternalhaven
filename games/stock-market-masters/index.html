<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Stock Market Masters is a free turn-based market game: eight desks, two casino machines per turn, buy and sell with buttons, cash out onto a live TOP Cashout ledger. Inspired by classic commodity boards — original title and extra stocks.">
<meta name="theme-color" content="#070b10">
<meta name="author" content="Justin Helmer / Excavationpro">
<link rel="canonical" href="https://chatagent.ca/games/stock-market-masters/">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="/games/hub.css">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chatagent.ca/games/stock-market-masters/">
<meta property="og:title" content="Stock Market Masters">
<meta property="og:description" content="Two machines. Eight desks. Buy, sell, ride splits and busts. Cash out for the TOP Cashout hall.">
<meta property="og:image" content="https://chatagent.ca/games/stock-market-masters/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@Excavationpro">
<meta name="twitter:title" content="Stock Market Masters">
<meta name="twitter:description" content="Turn-based market floor. Two casino machines spin two stocks each turn. Cash out to the live ledger.">
<meta name="twitter:image" content="https://chatagent.ca/games/stock-market-masters/assets/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./game.css">
</head>
<body>
<a class="games-exit" href="/games/">All games</a>
<div id="boot" class="boot">
  <p class="kicker">Δ9Φ963 · chatagent.ca</p>
  <h1>Stock Market Masters</h1>
  <p class="boot-msg">Opening the quotation floor…</p>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <a class="brand" href="/">chatagent.ca</a>
    <a class="games-mini" href="/games/">Games</a>
    <div class="phase-pill" id="phasePill">TRADE</div>
    <div class="res" id="resHud"></div>
    <a class="paypal-mini" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener noreferrer">PayPal</a>
  </header>
  <div class="stage">
    <div class="floor">
      <div class="machines" id="machines"></div>
      <div class="board" id="board"></div>
    </div>
    <aside class="bank" id="bank"></aside>
  </div>
  <footer class="dock">
    <button type="button" class="btn ghost" id="btnHelp">How to play</button>
    <button type="button" class="btn ghost" id="btnMenu">Floor / menu</button>
    <span class="grow" id="dockStatus"></span>
    <button type="button" class="btn" id="btnCash">Cash out</button>
    <button type="button" class="btn gold" id="btnSpin">Spin both machines</button>
  </footer>
</div>

<div id="overlay" class="overlay"></div>

<div id="radioDock" class="radio-dock">
  <audio id="radioEl" preload="none"></audio>
  <div class="radio-chip">
    <button type="button" id="radioView" title="Show or hide radio (music keeps playing)">Radio</button>
    <button type="button" id="radioMute" title="Mute radio (does not stop playback)">Mute</button>
    <a class="paypal-mini" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener noreferrer">Donate</a>
  </div>
  <div class="radio-panel" id="radioPanel">
    <div class="radio-head">
      <strong>Listen portal radio</strong>
      <a href="https://asiancoastline.com/listen.html" target="_blank" rel="noopener">asiancoastline.com/listen.html</a>
    </div>
    <div class="radio-title" id="radioTitle">Idle — press Play for Excavationpro radio</div>
    <div class="radio-row">
      <button type="button" id="radioPlay">Play</button>
      <button type="button" id="radioNext">Next</button>
      <label class="radio-vol">Vol <input id="radioVol" type="range" min="0" max="100" value="55"></label>
    </div>
  </div>
</div>

<script src="./radio.js"></script>
<script src="./game.js"></script>
</body>
</html>
